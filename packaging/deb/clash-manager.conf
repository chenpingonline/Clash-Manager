# systemd environment file. Restart clash-manager after changing this file.
# Use 0.0.0.0:8080 only when remote access is wanted.
LISTEN_ADDR=127.0.0.1:8080
APP_AUTH_USER=admin
APP_AUTH_PASSWORD_FILE=/etc/clash-manager/password
# Override occupied Mihomo ports before it starts (1-65535):
# APP_CONTROLLER_PORT=19097
# APP_MIXED_PORT=17897
# Optional colon-separated YAML import directories:
# APP_IMPORT_PATHS=/srv/clash-configs
