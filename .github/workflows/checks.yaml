name: Clash Manager checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  shared:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: go test -race ./... && go vet ./...
        working-directory: backend
      - run: npm ci && npm run check
        working-directory: web
      - name: Compile both Linux architectures
        working-directory: backend
        run: |
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -o /tmp/web-$arch ./cmd/clash-for-fnos-web
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -o /tmp/helper-$arch ./cmd/clash-for-fnos-helper
          done
      - name: Build Docker deployment from the same source
        run: ./scripts/build-docker.sh clash-manager:ci
      - name: Verify Docker lifecycle and persistence
        run: python3 scripts/docker-smoke.py clash-manager:ci
      - name: Build DEB packages for amd64 and arm64
        run: |
          ./scripts/build-deb.sh all
          python3 scripts/audit-deb.py dist/*.deb
      - name: Verify native Debian systemd lifecycle
        run: |
          docker build -f packaging/deb/test.Dockerfile -t clash-manager:deb-test-debian12 .
          python3 scripts/deb-smoke.py "dist/clash-manager_$(cat VERSION)_amd64.deb"
      - name: Verify native Ubuntu systemd lifecycle
        run: |
          docker build --build-arg BASE=ubuntu:24.04 -f packaging/deb/test.Dockerfile -t clash-manager:deb-test-ubuntu24 .
          python3 scripts/deb-smoke.py "dist/clash-manager_$(cat VERSION)_amd64.deb" --image clash-manager:deb-test-ubuntu24
      - uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: dist/*.deb*
